<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugare - Recuperando acceso...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #334155;
    }
    .card {
      background: #FFFFFF;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #F26B3A22;
      border-top-color: #F26B3A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
    }
    p {
      margin: 0;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Verificando enlace...</h2>
    <p>Te estamos redirigiendo para restablecer tu contraseña.</p>
  </div>

  <script>
    (function () {
      try {
        var hash = window.location.hash || '';
        var search = window.location.search || '';

        // Marcar que estamos en flujo de recuperación
        var isRecovery = hash.indexOf('type=recovery') !== -1 || search.indexOf('type=recovery') !== -1;
        if (isRecovery) {
          try {
            sessionStorage.setItem('lugare_password_recovery', 'true');
          } catch (e) {}
        }

        // Extraer los parámetros (tokens o código)
        var params = '';
        if (search && search.length > 1) {
          params = search.substring(1);
        }
        if (hash && hash.length > 1) {
          var cleanHash = hash.replace(/^#/, '');
          params = params ? (params + '&' + cleanHash) : cleanHash;
        }

        // Redirigir a la aplicación HashRouter preservando los tokens en search
        // para que Supabase los lea y React Router cargue la ruta /#/reset-password
        var targetUrl = '/' + (params ? '?' + params : '') + '#/reset-password';
        window.location.replace(targetUrl);
      } catch (err) {
        window.location.replace('/#/reset-password');
      }
    })();
  </script>
</body>
</html>
